services:
  watchyourlan:
    image: ghcr.io/gbomacfly/watchyourlan # GitHub Container Registry
    container_name: watchyourlan
    restart: unless-stopped
    # NET_ADMIN/NET_RAW replace 'network_mode: host', which arp-scan normally needs.
    # Note: with bridge networking (the default here) the container only sees Docker's
    # virtual network, not your LAN's physical interface. If device discovery comes up
    # empty, switch IFACES to your host's real interface via a macvlan network, or fall
    # back to 'network_mode: host' and expose the port on the host directly instead.
    cap_add:
    - NET_ADMIN
    - NET_RAW
    volumes:
    - ~/.dockerdata/watchyourlan:/data/WatchYourLAN
    env_file:
    - .env
    environment:
      TZ: "${TZ}"                  # required: needs your TZ for correct time
      IFACES: "${IFACES}"          # required: 1 or more interface, space separated
      HOST: "${HOST:-0.0.0.0}"           # optional, default: 0.0.0.0
      PORT: "${PORT:-8840}"              # optional, default: 8840
      TIMEOUT: "${TIMEOUT:-120}"         # optional, time in seconds, default: 120
      SHOUTRRR_URL: "${SHOUTRRR_URL:-}"  # optional, set url to notify
      THEME: "${THEME:-cyborg}"          # optional
      COLOR: "${COLOR:-system}"          # optional

# WARNING! ForAuth is the only externally exposed service here - it proxies to
# watchyourlan over the internal Docker network, so requests are authenticated
# before they ever reach WatchYourLAN itself.

  forauth:
    image: aceberg/forauth
    container_name: forauth
    restart: unless-stopped
    ports:
    - 8800:8800 # Proxy port
    - 8801:8801 # Config port
    volumes:
    - ~/.dockerdata/forauth:/data/ForAuth
    env_file:
    - .env
    environment:
      TZ: "${TZ}"                    # required: needs your TZ for correct time
      FA_TARGET: "watchyourlan:${PORT:-8840}" # path to watchyourlan container:port, on the shared Docker network
      FA_AUTH: "true"                 # optional: true - enabled, default: false
      FA_AUTH_EXPIRE: 7d              # optional: expiration time, default: 7d
      FA_AUTH_PASSWORD: "${FA_AUTH_PASSWORD}"
      # optional: password encrypted with bcrypt, how-to: https://github.com/aceberg/ForAuth/blob/main/docs/BCRYPT.md (In this example FA_AUTH_PASSWORD=pw)
      # Set the bcrypt hash in .env, not here - since it now comes from .env via
      # substitution, the hash's '$' characters do NOT need '$$' escaping there.
      FA_AUTH_USER: "${FA_AUTH_USER:-user}" # optional: username
