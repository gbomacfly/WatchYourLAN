services:
  node-bootstrap:                     # optional, local themes and icons
    image: aceberg/node-bootstrap
    container_name: node-bootstrap
    restart: unless-stopped
    ports:
    - 8850:8850
  watchyourlan:
    image: ghcr.io/gbomacfly/watchyourlan # GitHub Container Registry
    container_name: watchyourlan
    network_mode: "host"
    restart: unless-stopped
    # NodePath is already set via the Config UI/config_v2.yaml (http://192.168.178.84:8850),
    # so no need to also pass -n here. Uncomment the command line below only if you'd rather
    # manage it via the command line/env instead of the Config UI:
    # command: "-n http://YOUR_IP:8850"   # put your server IP or DNS name here
    depends_on:
    - node-bootstrap
    # dns:                                 # optional, e.g. a local Pi-hole/router, set DNS_IP in .env
    # - "${DNS_IP}"
    volumes:
    - ./data:/data/WatchYourLAN
    # optional override: watchyourlan already downloads and refreshes arp-scan's MAC
    # vendor database (ieee-oui.txt) by itself on startup and weekly after that. Only
    # uncomment this if you want to pin your own file instead (e.g. no internet access):
    # - ./oui/ieee-oui.txt:/usr/share/arp-scan/ieee-oui.txt:ro
    env_file:
    - .env
    environment:
      TZ: "${TZ:-Europe/Berlin}"   # optional, default: Europe/Berlin
      IFACES: "${IFACES}"          # required: 1 or more interface, space separated
      HOST: "${HOST:-0.0.0.0}"           # optional, default: 0.0.0.0
      PORT: "${PORT:-8840}"              # optional, default: 8840
      TIMEOUT: "${TIMEOUT:-120}"         # optional, time in seconds, default: 120
      SHOUTRRR_URL: "${SHOUTRRR_URL:-}"  # optional, set url to notify
      THEME: "${THEME:-cyborg}"          # optional
      COLOR: "${COLOR:-system}"          # optional

# WARNING! WYL needs 'host' network mode to work. So, WYL port will be exposed on the
# host directly. You need to limit access to it with a firewall or other measures.
